# ============================================
# 数据资产管理平台 — Nginx 配置（108 号 P0-03 原子发布版）
# 放置于 /etc/nginx/conf.d/data-asset.conf
#
# 前端采用版本目录 + current 软链接原子切换：
#   /opt/data-asset/frontend-dist/current -> releases/<build_id>
#
# 缓存策略（108 §三.9）：
#   - index.html            no-cache（或短缓存），保证新会话取到新 build ID
#   - hash JS/CSS/静态资源  immutable 长缓存
#   - 发布后由 release_frontend.sh 自动校验引用资源均 200
# ============================================

server {
    listen       80;
    server_name  10.10.8.83;

    charset      utf-8;
    client_max_body_size 50m;

    # 访问日志
    access_log  /var/log/nginx/data-asset-access.log;
    error_log   /var/log/nginx/data-asset-error.log;

    # 前端版本根（原子切换软链接）
    # 注意：nginx alias 中使用变量会导致静态资源 404；请用字面量 root 指向 current。
    # current -> /opt/data-asset/frontend-dist/releases/<build_id>

    # ========== 后端 API 反向代理 ==========
    location /api/ {
        proxy_pass          http://127.0.0.1:8000/api/;
        proxy_http_version  1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        # WebSocket 支持 (如需要)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # ========== 前端静态文件（版本目录原子切换）==========
    # 根路径 → SPA 入口；index.html 不长期缓存
    location / {
        root      /opt/data-asset/frontend-dist/current;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }

    # SPA 入口 index.html：no-cache / 短缓存，保证刷新拿到新 build
    location = /index.html {
        root      /opt/data-asset/frontend-dist/current;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # 静态资源 (dist/static/ 目录，hash 文件名 → immutable 长缓存)
    location /static/ {
        root /opt/data-asset/frontend-dist/current;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 资产包文件 (dist/assets/)
    location /assets/ {
        root /opt/data-asset/frontend-dist/current;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 平台配置（platform-config.json 不强缓存，便于切换环境）
    location = /platform-config.json {
        root      /opt/data-asset/frontend-dist/current;
        add_header Cache-Control "no-cache";
        expires 60;
    }
}
