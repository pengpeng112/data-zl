# 215 E12：后端最小 lint 门禁（ruff）——仅风格规则集，逐步引入。
# 契约：本批新增/改动文件必须 ruff 干净；存量违规按文件豁免（下方清单为
# 2026-10-13 基线，随各域改造逐步缩减；巨石文件见 services 侧长清单）；
# 不阻塞 pytest；暂不接 AGENTS 验收命令（状态登记于 215 §4）。
# 运行：backend/.venv/Scripts/python.exe -m ruff check app/ tests/
